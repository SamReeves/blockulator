# DigitalOcean App Platform spec for blockulator.com.
# The build downloads a pinned Zola (build.sh) and serves public/.
# To re-apply this spec after editing it: doctl apps update <app id> --spec .do/app.yaml
name: blockulator
static_sites:
  - name: blockulator-frontend
    github:
      repo: securedataresearch/blockulator
      branch: master
      deploy_on_push: true
    source_dir: /
    build_command: ./build.sh
    output_dir: public
    environment_slug: html
    catchall_document: 404.html
