name: whalegames
static_sites:
  - name: whalegames-frontend
    github:
      branch: testnet
      deploy_on_push: true
    build_command: |
      mkdir -p dist
      cp index.html styles.css blockulator.png blockulator_favicon.png dist/
      cp -r js dist/
      cp -r styles dist/
      cp -r contracts dist/
      ls -la dist/
    output_dir: dist
