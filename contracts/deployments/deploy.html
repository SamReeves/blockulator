<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contract Deployer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff00;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #1a1a1a;
            border: 2px solid #00ff00;
            padding: 30px;
            border-radius: 4px;
        }

        h1 {
            color: #00ff00;
            margin-bottom: 20px;
            text-align: center;
            font-size: 24px;
            text-transform: uppercase;
        }

        .status {
            background: #0a0a0a;
            border: 1px solid #00ff00;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        .status-item {
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
        }

        .label {
            color: #ffff00;
        }

        .value {
            color: #00ff00;
            word-break: break-all;
        }

        button {
            background: #00ff00;
            color: #0a0a0a;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            width: 100%;
            margin: 10px 0;
            transition: all 0.3s;
        }

        button:hover {
            background: #00cc00;
            transform: translateY(-2px);
        }

        button:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            transform: none;
        }

        .log {
            background: #0a0a0a;
            border: 1px solid #00ff00;
            padding: 15px;
            margin-top: 20px;
            height: 300px;
            overflow-y: auto;
            font-size: 12px;
            border-radius: 4px;
        }

        .log-entry {
            margin: 4px 0;
            padding: 4px;
        }

        .log-info { color: #00ccff; }
        .log-success { color: #00ff00; }
        .log-error { color: #ff0000; }
        .log-warning { color: #ffaa00; }

        .contract-info {
            background: #0a0a0a;
            border: 1px solid #ffff00;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }

        .contract-info h3 {
            color: #ffff00;
            margin-bottom: 10px;
        }

        input {
            background: #0a0a0a;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 10px;
            width: 100%;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            border-radius: 4px;
        }

        input:focus {
            outline: none;
            border-color: #ffff00;
        }

        .hidden {
            display: none;
        }

        .divider {
            border-top: 1px solid #333;
            margin: 20px 0;
        }

        a {
            color: #00ccff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Contract Deployer ⚡</h1>

        <div class="status">
            <div class="status-item">
                <span class="label">Wallet:</span>
                <span class="value" id="walletAddress">Not Connected</span>
            </div>
            <div class="status-item">
                <span class="label">Network:</span>
                <span class="value" id="networkName">Unknown</span>
            </div>
            <div class="status-item">
                <span class="label">Balance:</span>
                <span class="value" id="balance">0 ETH</span>
            </div>
        </div>

        <button id="connectBtn" onclick="connectWallet()">Connect MetaMask</button>

        <div id="deploySection" class="hidden">
            <div class="divider"></div>

            <div class="contract-info">
                <h3>Contract Information</h3>
                <div class="status-item">
                    <span class="label">Name:</span>
                    <span class="value" id="contractName">Loading...</span>
                </div>
                <div class="status-item">
                    <span class="label">Size:</span>
                    <span class="value" id="contractSize">Loading...</span>
                </div>
            </div>

            <label class="label" for="gasLimit">Gas Limit (optional):</label>
            <input type="number" id="gasLimit" placeholder="Auto (leave empty for estimate)">

            <label class="label" for="value">Value to Send (ETH):</label>
            <input type="text" id="value" placeholder="0" value="0">

            <button id="deployBtn" onclick="deployContract()">🚀 Deploy Contract</button>

            <div id="deployedInfo" class="contract-info hidden">
                <h3>✅ Deployment Successful!</h3>
                <div class="status-item">
                    <span class="label">Address:</span>
                    <span class="value" id="deployedAddress"></span>
                </div>
                <div class="status-item">
                    <span class="label">Transaction:</span>
                    <span class="value" id="deployedTx"></span>
                </div>
                <div class="status-item">
                    <span class="label">Explorer:</span>
                    <span class="value"><a id="explorerLink" target="_blank">View on Explorer</a></span>
                </div>
            </div>
        </div>

        <div class="log" id="log">
            <div class="log-entry log-info">Ready to deploy...</div>
        </div>
    </div>

    <script>
        let web3;
        let account;
        let chainId;
        let deployConfig;

        const NETWORK_NAMES = {
            1: 'Ethereum Mainnet',
            5: 'Goerli Testnet',
            11155111: 'Sepolia Testnet',
            137: 'Polygon Mainnet',
            80001: 'Mumbai Testnet',
            31337: 'Localhost'
        };

        const EXPLORERS = {
            1: 'https://etherscan.io',
            5: 'https://goerli.etherscan.io',
            11155111: 'https://sepolia.etherscan.io',
            137: 'https://polygonscan.com',
            80001: 'https://mumbai.polygonscan.com'
        };

        function log(message, type = 'info') {
            const logEl = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }

        async function loadDeployConfig() {
            try {
                const response = await fetch('deploy-config.json');
                deployConfig = await response.json();
                document.getElementById('contractName').textContent = deployConfig.contractName;
                log(`Loaded config for ${deployConfig.contractName}`, 'success');
                return true;
            } catch (error) {
                log('Error loading deploy config. Run compile-and-prepare.sh first!', 'error');
                return false;
            }
        }

        async function connectWallet() {
            if (typeof window.ethereum === 'undefined') {
                log('MetaMask is not installed!', 'error');
                alert('Please install MetaMask to continue.');
                return;
            }

            try {
                log('Connecting to MetaMask...', 'info');
                
                const accounts = await window.ethereum.request({ 
                    method: 'eth_requestAccounts' 
                });
                
                account = accounts[0];
                chainId = await window.ethereum.request({ method: 'eth_chainId' });
                chainId = parseInt(chainId, 16);

                document.getElementById('walletAddress').textContent = 
                    account.substring(0, 6) + '...' + account.substring(38);
                
                document.getElementById('networkName').textContent = 
                    NETWORK_NAMES[chainId] || `Chain ID: ${chainId}`;

                const balance = await window.ethereum.request({
                    method: 'eth_getBalance',
                    params: [account, 'latest']
                });
                const ethBalance = parseInt(balance, 16) / 1e18;
                document.getElementById('balance').textContent = 
                    ethBalance.toFixed(4) + ' ETH';

                log(`Connected to ${account}`, 'success');
                log(`Network: ${NETWORK_NAMES[chainId] || chainId}`, 'info');

                document.getElementById('connectBtn').style.display = 'none';
                
                const configLoaded = await loadDeployConfig();
                if (configLoaded) {
                    document.getElementById('deploySection').classList.remove('hidden');
                    await loadContractData();
                }

            } catch (error) {
                log(`Connection failed: ${error.message}`, 'error');
            }
        }

        async function loadContractData() {
            try {
                const bytecodeResponse = await fetch(`../../${deployConfig.bytecodePath}`);
                const bytecodeData = await bytecodeResponse.json();
                const bytecode = bytecodeData.bytecode;
                
                const size = (bytecode.length - 2) / 2; // Remove 0x and convert to bytes
                document.getElementById('contractSize').textContent = 
                    `${size.toLocaleString()} bytes`;

                if (size > 24576) {
                    log('WARNING: Contract exceeds 24KB limit!', 'warning');
                }

                log('Contract data loaded successfully', 'success');
            } catch (error) {
                log(`Error loading contract data: ${error.message}`, 'error');
            }
        }

        async function deployContract() {
            const deployBtn = document.getElementById('deployBtn');
            deployBtn.disabled = true;
            deployBtn.textContent = '⏳ Deploying...';

            try {
                log('Loading contract bytecode...', 'info');
                
                const bytecodeResponse = await fetch(`../../${deployConfig.bytecodePath}`);
                const bytecodeData = await bytecodeResponse.json();
                const bytecode = bytecodeData.bytecode;

                const value = document.getElementById('value').value || '0';
                const valueWei = '0x' + Math.floor(parseFloat(value) * 1e18).toString(16);

                const gasLimitInput = document.getElementById('gasLimit').value;
                let gasLimit;

                if (!gasLimitInput) {
                    log('Estimating gas...', 'info');
                    try {
                        gasLimit = await window.ethereum.request({
                            method: 'eth_estimateGas',
                            params: [{
                                from: account,
                                data: bytecode,
                                value: valueWei
                            }]
                        });
                        // Add 20% buffer
                        gasLimit = '0x' + Math.floor(parseInt(gasLimit, 16) * 1.2).toString(16);
                        log(`Estimated gas: ${parseInt(gasLimit, 16).toLocaleString()}`, 'info');
                    } catch (error) {
                        log('Gas estimation failed, using default', 'warning');
                        gasLimit = '0x2DC6C0'; // 3,000,000
                    }
                } else {
                    gasLimit = '0x' + parseInt(gasLimitInput).toString(16);
                }

                log('Sending deployment transaction...', 'info');

                const txHash = await window.ethereum.request({
                    method: 'eth_sendTransaction',
                    params: [{
                        from: account,
                        data: bytecode,
                        gas: gasLimit,
                        value: valueWei
                    }]
                });

                log(`Transaction sent: ${txHash}`, 'info');
                log('Waiting for confirmation...', 'info');

                // Wait for transaction receipt
                let receipt = null;
                let attempts = 0;
                while (!receipt && attempts < 60) {
                    await new Promise(resolve => setTimeout(resolve, 2000));
                    receipt = await window.ethereum.request({
                        method: 'eth_getTransactionReceipt',
                        params: [txHash]
                    });
                    attempts++;
                }

                if (!receipt) {
                    throw new Error('Transaction timeout');
                }

                const contractAddress = receipt.contractAddress;

                log('✅ CONTRACT DEPLOYED!', 'success');
                log(`Address: ${contractAddress}`, 'success');

                document.getElementById('deployedAddress').textContent = contractAddress;
                document.getElementById('deployedTx').textContent = txHash;
                
                const explorerLink = document.getElementById('explorerLink');
                if (EXPLORERS[chainId]) {
                    explorerLink.href = `${EXPLORERS[chainId]}/address/${contractAddress}`;
                } else {
                    explorerLink.style.display = 'none';
                }

                document.getElementById('deployedInfo').classList.remove('hidden');

                // Update addresses.js
                await updateAddressesFile(deployConfig.contractName, contractAddress, chainId);

            } catch (error) {
                log(`Deployment failed: ${error.message}`, 'error');
                deployBtn.disabled = false;
                deployBtn.textContent = '🚀 Deploy Contract';
            }
        }

        async function updateAddressesFile(contractName, address, chainId) {
            log('Updating addresses.js...', 'info');
            
            const network = chainId === 11155111 ? 'sepolia' : 
                           chainId === 1 ? 'mainnet' : 
                           chainId === 31337 ? 'localhost' : 'unknown';

            const updateData = {
                contractName,
                address,
                network,
                chainId,
                timestamp: new Date().toISOString()
            };

            // Note: Since we can't directly write files from browser,
            // we'll display the info for manual update or use a backend endpoint
            log(`Add to addresses.js (${network.toUpperCase()}):`, 'warning');
            log(`${contractName}: '${address}'`, 'warning');
            
            // Try to save to localStorage for later retrieval
            const key = `deployed_${contractName}_${network}`;
            localStorage.setItem(key, JSON.stringify(updateData));
            
            log('Saved to browser storage. Copy address to addresses.js', 'info');
        }

        // Listen for account changes
        if (typeof window.ethereum !== 'undefined') {
            window.ethereum.on('accountsChanged', (accounts) => {
                if (accounts.length === 0) {
                    log('MetaMask disconnected', 'warning');
                    location.reload();
                } else {
                    location.reload();
                }
            });

            window.ethereum.on('chainChanged', () => {
                location.reload();
            });
        }

        // Load config on page load
        window.addEventListener('load', () => {
            log('Page loaded. Connect wallet to begin.', 'info');
        });
    </script>
</body>
</html>
