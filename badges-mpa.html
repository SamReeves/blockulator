<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WhaleGames - Badge Management System">
    <title>Badges - WhaleGames</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐋</text></svg>">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="badges-page">
    <!-- Shared header loaded dynamically -->
    <div id="header-container"></div>
    
    <main class="page-content">
        <!-- Breadcrumb navigation -->
        <nav class="breadcrumb">
            <a href="/index.html" class="breadcrumb-link">Home</a> →
            <span class="breadcrumb-current">Badges</span>
        </nav>
        
        <!-- Badge content will be dynamically loaded here -->
        <div id="badges-container"></div>
    </main>
    
    <!-- Toast container -->
    <div id="toast-container"></div>
    
    <!-- Initialize page -->
    <script type="module">
        import { initializePage } from '/shared/js/page-initializer.js';
        import { BadgeManager } from '/js/domain/identity/badge-manager.js';
        
        async function init() {
            try {
                // Initialize common page components
                const { web3Provider } = await initializePage();
                
                // Initialize badges module
                const container = document.getElementById('badges-container');
                const badgesModule = new BadgeManager();
                await badgesModule.init(container, web3Provider);
                
                console.log('✅ Badges page ready');
            } catch (error) {
                console.error('❌ Failed to initialize page:', error);
            }
        }
        
        init();
    </script>
</body>
</html>
