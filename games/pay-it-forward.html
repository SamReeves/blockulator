<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get previous player's donation - Blockulator">
    <title>Pay It Forward - Blockulator</title>
    <link rel="icon" type="image/png" href="/blockulator_favicon.png">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="game-page">
    <!-- Shared header loaded dynamically -->
    <div id="header-container"></div>
    
    <main class="page-content">
        <!-- Breadcrumb navigation -->
        <nav class="breadcrumb">
            <a href="/index.html" class="breadcrumb-link">Home</a> →
            <a href="/games/index.html" class="breadcrumb-link">Games</a> →
            <span class="breadcrumb-current">Pay It Forward</span>
        </nav>
        
        <!-- Game container -->
        <div id="game-container" class="game-container"></div>
    </main>
    
    <!-- Toast container -->
    <div id="toast-container"></div>
    
    <!-- Initialize page -->
    <script type="module">
        import { initializePage } from '/shared/js/page-initializer.js';
        import { PayItForward } from '/js/domain/games/pay-it-forward.js';
        
        async function init() {
            try {
                // Initialize common page components
                const { web3Provider } = await initializePage();
                
                // Initialize game
                const container = document.getElementById('game-container');
                const game = new PayItForward(container, web3Provider);
                await game.init();
                
                console.log('✅ Pay It Forward page ready');
            } catch (error) {
                console.error('❌ Failed to initialize page:', error);
            }
        }
        
        // Start initialization
        init();
    </script>
</body>
</html>
