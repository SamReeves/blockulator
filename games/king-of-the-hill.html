<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dethrone king, stakes grow - WhaleGames">
    <title>King of the Hill - WhaleGames</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐋</text></svg>">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="game-page">
    <!-- Shared header loaded dynamically -->
    <div id="header-container"></div>
    
    <main class="page-content">
        <!-- Breadcrumb navigation -->
        <nav class="breadcrumb">
            <a href="/index.html" class="breadcrumb-link">Home</a> →
            <a href="/games/index.html" class="breadcrumb-link">Games</a> →
            <span class="breadcrumb-current">King of the Hill</span>
        </nav>
        
        <!-- Game container -->
        <div id="game-container" class="game-container"></div>
    </main>
    
    <!-- Toast container -->
    <div id="toast-container"></div>
    
    <!-- Initialize page -->
    <script type="module">
        import { initializePage } from '/shared/js/page-initializer.js';
        import { KingOfTheHill } from '/js/domain/games/king-of-the-hill.js';
        
        async function init() {
            try {
                // Initialize common page components
                const { web3Provider } = await initializePage();
                
                // Initialize game
                const container = document.getElementById('game-container');
                const game = new KingOfTheHill(container, web3Provider);
                await game.init();
                
                console.log('✅ King of the Hill page ready');
            } catch (error) {
                console.error('❌ Failed to initialize page:', error);
            }
        }
        
        // Start initialization
        init();
    </script>
</body>
</html>
