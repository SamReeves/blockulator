<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="WhaleGames.net Tools - On-chain mathematical calculators">
    <meta name="view-transition" content="same-origin">
    <title>WhaleGames.net - Tools</title>
    <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <h1 class="app-title">🔧 WhaleGames Tools</h1>
                <span class="testnet-badge">🚧 TESTNET</span>
                <span id="readonly-badge" class="readonly-badge">👀 Browsing</span>
            </div>
            <nav class="header-nav">
                <a href="index.html" class="nav-link">🎮 Games</a>
                <a href="tools.html" class="nav-link nav-link-active">🔧 Tools</a>
                <a href="futures.html" class="nav-link">📈 Futures</a>
                <a href="https://sepolia-faucet.pk910.de/" class="nav-link" target="_blank">💧 Faucet</a>
                <button id="joy-button" class="nav-link nav-button">✨ Joy</button>
            </nav>
            <div class="header-right">
                <button id="connect-wallet" class="btn-connect">Connect Wallet</button>
            <div id="wallet-info" class="wallet-info hidden">
                    <div class="wallet-line">
                        <span id="wallet-address" class="wallet-value"></span>
                        <button id="copy-address" class="copy-btn" title="Copy address">📋</button>
                    </div>
                    <div class="wallet-line">
                        <span id="wallet-balance" class="wallet-value"></span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="content" class="content">
            <div class="tool-list">
                <button class="tool-card" data-tool="e-calculator">
                    <h3>🔢 e Calculator</h3>
                    <p>Calculate e^x on-chain</p>
                </button>
                <button class="tool-card" data-tool="pi-calculator">
                    <h3>🥧 π Calculator</h3>
                    <p>Calculate π^x on-chain</p>
                </button>
                <button class="tool-card" data-tool="tau-calculator">
                    <h3>⭕ τ Calculator</h3>
                    <p>Calculate τ^x on-chain</p>
                </button>
                <button class="tool-card" data-tool="sin-calculator">
                    <h3>📐 sin(x) Calculator</h3>
                    <p>Calculate sine on-chain</p>
                </button>
                <button class="tool-card" data-tool="cos-calculator">
                    <h3>📐 cos(x) Calculator</h3>
                    <p>Calculate cosine on-chain</p>
                </button>
                <button class="tool-card" data-tool="tanh-calculator">
                    <h3>🌊 tanh(x) Calculator</h3>
                    <p>Calculate hyperbolic tangent on-chain</p>
                </button>
                <button class="tool-card" data-tool="pow10-calculator">
                    <h3>🔟 10^x Calculator</h3>
                    <p>Calculate powers of 10 on-chain</p>
                </button>
                <button class="tool-card" data-tool="pow2-calculator">
                    <h3>🔢 2^x Calculator</h3>
                    <p>Calculate powers of 2 on-chain</p>
                </button>
                <button class="tool-card" data-tool="ln-calculator">
                    <h3>📐 ln(x) Calculator</h3>
                    <p>Calculate natural logarithm on-chain</p>
                </button>
                <button class="tool-card" data-tool="log2-calculator">
                    <h3>🔢 log₂(x) Calculator</h3>
                    <p>Calculate binary logarithm on-chain</p>
                </button>
                <button class="tool-card" data-tool="log10-calculator">
                    <h3>📊 log₁₀(x) Calculator</h3>
                    <p>Calculate common logarithm on-chain</p>
                </button>
                <button class="tool-card" data-tool="sqrt-calculator">
                    <h3>√ sqrt(x) Calculator</h3>
                    <p>Calculate square root on-chain</p>
                </button>
                <button class="tool-card" data-tool="erf-calculator">
                    <h3>📊 erf(x) Calculator</h3>
                    <p>Calculate error function on-chain</p>
                </button>
            </div>
            
            <!-- Tool Detail View -->
            <div id="tool-detail" class="tool-detail hidden">
                <button id="back-to-tools" class="btn-back">← Back</button>
                <div id="tool-container"></div>
            </div>
        </main>


        <!-- Toast notifications -->
        <div id="toast-container" class="toast-container"></div>

        <!-- Canvas for animations/effects -->
        <canvas id="effects-canvas" class="effects-canvas"></canvas>
    </div>

    <!-- Web3 Libraries (CDN for now, can be replaced) -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    
    <!-- App Scripts -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
