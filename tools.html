<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="WhaleGames.net Tools - On-chain mathematical calculators">
    <title>WhaleGames.net - Tools</title>
    <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <h1 class="app-title">🔧 WhaleGames Tools</h1>
                <span class="testnet-badge">🚧 TESTNET</span>
            </div>
            <button id="connect-wallet" class="btn-connect">Connect Wallet</button>
            <div id="wallet-info" class="wallet-info hidden">
                <span id="wallet-address"></span>
                <span id="wallet-balance"></span>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="content" class="content">
            <div class="tool-list">
                <button class="tool-card" data-tool="e-calculator">
                    <h3>🔢 e Calculator</h3>
                    <p>Calculate e^x on-chain</p>
                </button>
                <button class="tool-card" data-tool="pi-calculator">
                    <h3>🥧 π Calculator</h3>
                    <p>Calculate π^x on-chain</p>
                </button>
                <button class="tool-card" data-tool="tau-calculator">
                    <h3>⭕ τ Calculator</h3>
                    <p>Calculate τ^x on-chain</p>
                </button>
                <button class="tool-card" data-tool="sin-calculator">
                    <h3>📐 sin(x) Calculator</h3>
                    <p>Calculate sine on-chain</p>
                </button>
                <button class="tool-card" data-tool="cos-calculator">
                    <h3>📐 cos(x) Calculator</h3>
                    <p>Calculate cosine on-chain</p>
                </button>
                <button class="tool-card" data-tool="tanh-calculator">
                    <h3>🌊 tanh(x) Calculator</h3>
                    <p>Calculate hyperbolic tangent on-chain</p>
                </button>
            </div>
            
            <!-- Tool Detail View -->
            <div id="tool-detail" class="tool-detail hidden">
                <button id="back-to-tools" class="btn-back">← Back</button>
                <div id="tool-container"></div>
            </div>
        </main>

        <!-- Footer Links -->
        <footer class="app-footer">
            <a href="index.html" class="footer-link">🎮 Games</a>
            <span class="footer-separator">•</span>
            <a href="https://sepolia-faucet.pk910.de/" class="footer-link">💧 Faucet</a>
        </footer>

        <!-- Toast notifications -->
        <div id="toast-container" class="toast-container"></div>

        <!-- Canvas for animations/effects -->
        <canvas id="effects-canvas" class="effects-canvas"></canvas>
    </div>

    <!-- Web3 Libraries (CDN for now, can be replaced) -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    
    <!-- App Scripts -->
    <script type="module" src="js/unified-app.js?v=5"></script>
</body>
</html>
