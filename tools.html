<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WhaleGames - On-chain mathematical calculators">
    <title>WhaleGames - Tools</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐋</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Header loaded dynamically -->

        <main id="content" class="content">
            <div class="tool-list">
                <button class="tool-card" data-tool="e-calculator" data-emoji="📊">
                    <h3>📊 e^x</h3>
                    <p>Euler's exponential</p>
                </button>
                <button class="tool-card" data-tool="pi-calculator" data-emoji="🥧">
                    <h3>🥧 π^x</h3>
                    <p>Pi exponential</p>
                </button>
                <button class="tool-card" data-tool="tau-calculator" data-emoji="⭕">
                    <h3>⭕ τ^x</h3>
                    <p>Tau exponential</p>
                </button>
                <button class="tool-card" data-tool="sin-calculator" data-emoji="🌊">
                    <h3>🌊 sin</h3>
                    <p>Sine function</p>
                </button>
                <button class="tool-card" data-tool="cos-calculator" data-emoji="〰️">
                    <h3>〰️ cos</h3>
                    <p>Cosine function</p>
                </button>
                <button class="tool-card" data-tool="tanh-calculator" data-emoji="📈">
                    <h3>📈 tanh</h3>
                    <p>Hyperbolic tangent</p>
                </button>
                <button class="tool-card" data-tool="pow10-calculator" data-emoji="🔟">
                    <h3>🔟 10^x</h3>
                    <p>Powers of ten</p>
                </button>
                <button class="tool-card" data-tool="pow2-calculator" data-emoji="💾">
                    <h3>💾 2^x</h3>
                    <p>Powers of two</p>
                </button>
                <button class="tool-card" data-tool="ln-calculator" data-emoji="🪵">
                    <h3>🪵 ln</h3>
                    <p>Natural logarithm</p>
                </button>
                <button class="tool-card" data-tool="log2-calculator" data-emoji="💿">
                    <h3>💿 log₂</h3>
                    <p>Binary logarithm</p>
                </button>
                <button class="tool-card" data-tool="log10-calculator" data-emoji="🔢">
                    <h3>🔢 log₁₀</h3>
                    <p>Common logarithm</p>
                </button>
                <button class="tool-card" data-tool="sqrt-calculator" data-emoji="√">
                    <h3>√ Square Root</h3>
                    <p>Principal square root</p>
                </button>
                <button class="tool-card" data-tool="erf-calculator" data-emoji="📉">
                    <h3>📉 erf</h3>
                    <p>Error function</p>
                </button>
            </div>
            
            <div id="tool-detail" class="tool-detail hidden">
                <button id="back-to-tools" class="btn-back">← Back</button>
                <div id="tool-container"></div>
            </div>
        </main>

        <div id="toast-container" class="toast-container"></div>
        <canvas id="effects-canvas" class="effects-canvas"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script type="module">
        import { HeaderLoader } from './js/presentation/components/header-loader.js';
        await HeaderLoader.load('tools');
    </script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
