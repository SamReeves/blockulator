<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WhaleGames - Blockchain games on Sepolia testnet">
    <title>WhaleGames - Games</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Header loaded dynamically -->

        <main id="content" class="content">
            <div class="game-list">
                <button class="game-card" data-game="pissing-contest" data-emoji="💦">
                    <h3>💦 Pissing Contest</h3>
                    <p>Biggest donation takes the pot</p>
                </button>
                <button class="game-card" data-game="pay-it-forward" data-emoji="⏩">
                    <h3>⏩ Pay It Forward</h3>
                    <p>Get previous player's donation</p>
                </button>
                <button class="game-card" data-game="pay-it-backward" data-emoji="⏪">
                    <h3>⏪ Pay It Backward</h3>
                    <p>Reward the previous donor</p>
                </button>
                <button class="game-card" data-game="message-board" data-emoji="💬">
                    <h3>💬 Message Board</h3>
                    <p>Permanent on-chain messages</p>
                </button>
                <button class="game-card" data-game="king-of-the-hill" data-emoji="👑">
                    <h3>👑 King of the Hill</h3>
                    <p>Dethrone king, stakes grow</p>
                </button>
                <button class="game-card" data-game="last-call" data-emoji="⏰">
                    <h3>⏰ Last Call</h3>
                    <p>Last donor wins after timer</p>
                </button>
                <button class="game-card" data-game="time-to-make-the-donuts" data-emoji="🍩">
                    <h3>🍩 Make the Donuts</h3>
                    <p>First donor daily at midnight</p>
                </button>
                <button class="game-card" data-game="dice-gods" data-emoji="🎲">
                    <h3>🎲 Dice Gods</h3>
                    <p>Pick the least popular number</p>
                </button>
                <button class="game-card" data-game="satan-moloch-baal" data-emoji="🔥">
                    <h3>🔥 Satan, Moloch, Baal</h3>
                    <p>Vote for demons or burn to void</p>
                </button>
            </div>
            
            <div id="game-detail" class="game-detail hidden">
                <button id="back-to-games" class="btn-back">← Back</button>
                <div id="game-container"></div>
            </div>
        </main>

        <div id="toast-container" class="toast-container"></div>
        <canvas id="effects-canvas" class="effects-canvas"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script type="module">
        import { HeaderLoader } from './js/presentation/components/header-loader.js';
        await HeaderLoader.load('games');
    </script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
