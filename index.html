<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="WhaleGames.net - Play blockchain-based games on Sepolia testnet">
    <meta name="view-transition" content="same-origin">
    <title>WhaleGames.net - Blockchain Games</title>
    <link rel="stylesheet" href="styles.css?v=4">
</head>
<!-- Version: 4.0 - Fixed custom UI for tools too -->
<body>
    <div id="app">
        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <h1 class="app-title">🐋 WhaleGames</h1>
                <span class="testnet-badge">🚧 TESTNET</span>
                <span id="readonly-badge" class="readonly-badge">👀 Browsing</span>
            </div>
            <button id="connect-wallet" class="btn-connect">Connect to Play</button>
            <div id="wallet-info" class="wallet-info hidden">
                <span id="wallet-address"></span>
                <span id="wallet-balance"></span>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="content" class="content">
            <div class="game-list">
                <button class="game-card" data-game="pissing-contest">
                    <h3>💦 Pissing Contest</h3>
                    <p>Make the biggest donation to win the pot</p>
                </button>
                <button class="game-card" data-game="pay-it-forward">
                    <h3>⏩ Pay It Forward</h3>
                    <p>Donate and instantly receive the previous donation</p>
                </button>
                <button class="game-card" data-game="pay-it-backward">
                    <h3>⏪ Pay It Backward</h3>
                    <p>Your donation rewards the previous donor</p>
                </button>
                <button class="game-card" data-game="message-board">
                    <h3>💬 Message Board</h3>
                    <p>Post permanent on-chain messages</p>
                </button>
                <button class="game-card" data-game="king-of-the-hill">
                    <h3>👑 King of the Hill</h3>
                    <p>Pay to dethrone and claim the prize. Stakes grow!</p>
                </button>
                <button class="game-card" data-game="last-call">
                    <h3>⏰ Last Call</h3>
                    <p>Be the LAST donor before 10-day timer ends. Win 99%!</p>
                </button>
                <button class="game-card" data-game="time-to-make-the-donuts">
                    <h3>🍩 Time to Make the Donuts</h3>
                    <p>Be FIRST donor each day at 00:00 UTC. Win 99%!</p>
                </button>
                <button class="game-card" data-game="dice-gods">
                    <h3>🎲 Dice Gods</h3>
                    <p>Pick the LEAST popular number (1-6) to win the pot</p>
                </button>
            </div>
            
            <!-- Game Detail View -->
            <div id="game-detail" class="game-detail hidden">
                <button id="back-to-games" class="btn-back">← Back</button>
                <div id="game-container"></div>
            </div>
        </main>

        <!-- Footer Links -->
        <footer class="app-footer">
            <a href="tools.html" class="footer-link">🔧 Tools</a>
            <span class="footer-separator">•</span>
            <a href="https://sepolia-faucet.pk910.de/" class="footer-link">💧 Faucet</a>
            <span class="footer-separator">•</span>
            <button id="joy-button" class="footer-link footer-button">✨ Joy</button>
        </footer>

        <!-- Toast notifications -->
        <div id="toast-container" class="toast-container"></div>

        <!-- Canvas for animations/effects -->
        <canvas id="effects-canvas" class="effects-canvas"></canvas>
    </div>

    <!-- Web3 Libraries (CDN for now, can be replaced) -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    
    <!-- App Scripts -->
    <script type="module" src="js/unified-app.js?v=5"></script>
</body>
</html>
