<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPC & Wallet Integration Test</title>
    <link rel="icon" type="image/png" href="/blockulator_favicon.png">
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #00ff00;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #00ff00;
            border-radius: 5px;
        }
        .test-section h3 {
            margin: 0 0 10px 0;
            color: #00ffff;
        }
        .status {
            margin: 5px 0;
            padding: 5px;
        }
        .success { color: #00ff00; }
        .error { color: #ff0000; }
        .warning { color: #ffff00; }
        button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin: 10px 5px 0 0;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
            border-radius: 5px;
        }
        button:hover {
            background: #00ffff;
        }
        #log {
            background: #000;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #333;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>🧪 Blockulator Integration Test</h1>
    
    <div class="test-section">
        <h3>Test 1: RPC Provider Connection</h3>
        <div id="rpc-status">Not tested</div>
        <button onclick="testRPC()">Test RPC</button>
    </div>
    
    <div class="test-section">
        <h3>Test 2: Wallet Connection (MetaMask)</h3>
        <div id="wallet-status">Not connected</div>
        <button onclick="testWalletConnect()">Connect Wallet</button>
    </div>
    
    <div class="test-section">
        <h3>Test 3: Contract Loading (Last Call)</h3>
        <div id="contract-status">Not tested</div>
        <button onclick="testContractLoad()">Load Contract</button>
    </div>
    
    <div class="test-section">
        <h3>Test 4: Contract State Reading</h3>
        <div id="state-status">Not tested</div>
        <button onclick="testContractState()">Read State</button>
    </div>
    
    <div class="test-section">
        <h3>Console Log</h3>
        <div id="log"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script type="module">
        import { config } from './js/infrastructure/config/network.js';
        import { CONTRACT_ADDRESSES } from './js/infrastructure/config/contracts.js';
        
        window.config = config;
        window.CONTRACT_ADDRESSES = CONTRACT_ADDRESSES;
        
        let provider = null;
        let signer = null;
        let contract = null;
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#ff0000' : type === 'success' ? '#00ff00' : type === 'warning' ? '#ffff00' : '#00ffff';
            logDiv.innerHTML += `<div style="color: ${color}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }
        
        window.testRPC = async function() {
            const statusDiv = document.getElementById('rpc-status');
            statusDiv.className = 'status';
            statusDiv.textContent = 'Testing...';
            
            try {
                log(`Connecting to: ${config.rpcUrl}`, 'info');
                provider = new ethers.providers.JsonRpcProvider(config.rpcUrl);
                
                log('Fetching block number...', 'info');
                const blockNumber = await provider.getBlockNumber();
                
                const network = await provider.getNetwork();
                
                statusDiv.className = 'status success';
                statusDiv.innerHTML = `✅ Connected<br>Block: ${blockNumber.toLocaleString()}<br>Chain ID: ${network.chainId}`;
                log(`✅ RPC Connected! Block: ${blockNumber}`, 'success');
                
            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.textContent = `❌ Failed: ${error.message}`;
                log(`❌ RPC Error: ${error.message}`, 'error');
            }
        };
        
        window.testWalletConnect = async function() {
            const statusDiv = document.getElementById('wallet-status');
            statusDiv.className = 'status';
            statusDiv.textContent = 'Connecting...';
            
            try {
                if (!window.ethereum) {
                    throw new Error('MetaMask not installed');
                }
                
                log('Requesting wallet connection...', 'info');
                await window.ethereum.request({ method: 'eth_requestAccounts' });
                
                const web3Provider = new ethers.providers.Web3Provider(window.ethereum);
                signer = web3Provider.getSigner();
                const address = await signer.getAddress();
                const balance = await web3Provider.getBalance(address);
                
                provider = web3Provider; // Update provider to use wallet
                
                statusDiv.className = 'status success';
                statusDiv.innerHTML = `✅ Connected<br>Address: ${address.slice(0, 10)}...${address.slice(-8)}<br>Balance: ${ethers.utils.formatEther(balance).slice(0, 8)} ETH`;
                log(`✅ Wallet Connected: ${address}`, 'success');
                
            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.textContent = `❌ Failed: ${error.message}`;
                log(`❌ Wallet Error: ${error.message}`, 'error');
            }
        };
        
        window.testContractLoad = async function() {
            const statusDiv = document.getElementById('contract-status');
            statusDiv.className = 'status';
            statusDiv.textContent = 'Loading...';
            
            try {
                if (!provider) {
                    throw new Error('Please test RPC connection first');
                }
                
                const contractAddress = CONTRACT_ADDRESSES.LAST_CALL;
                log(`Loading contract at: ${contractAddress}`, 'info');
                
                const response = await fetch('/contracts/build/abis/last-call.json');
                if (!response.ok) {
                    throw new Error('Failed to fetch ABI');
                }
                const abi = await response.json();
                
                contract = new ethers.Contract(contractAddress, abi, provider);
                if (signer) {
                    contract = contract.connect(signer);
                }
                
                statusDiv.className = 'status success';
                statusDiv.innerHTML = `✅ Contract Loaded<br>Address: ${contractAddress.slice(0, 10)}...${contractAddress.slice(-8)}<br>Has Signer: ${!!signer}`;
                log(`✅ Contract loaded with ${signer ? 'SIGNER' : 'READ-ONLY'}`, 'success');
                
            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.textContent = `❌ Failed: ${error.message}`;
                log(`❌ Contract Error: ${error.message}`, 'error');
            }
        };
        
        window.testContractState = async function() {
            const statusDiv = document.getElementById('state-status');
            statusDiv.className = 'status';
            statusDiv.textContent = 'Reading...';
            
            try {
                if (!contract) {
                    throw new Error('Please load contract first');
                }
                
                log('Reading contract state...', 'info');
                
                const roundNumber = await contract.round_number();
                const potValue = await contract.get_pot();
                const lastDonor = await contract.last_donor();
                const roundEndsAt = await contract.round_ends_at();
                
                statusDiv.className = 'status success';
                statusDiv.innerHTML = `✅ State Read Successfully<br>
                    Round: ${roundNumber.toString()}<br>
                    Pot: ${ethers.utils.formatEther(potValue)} ETH<br>
                    Last Donor: ${lastDonor.slice(0, 10)}...${lastDonor.slice(-8)}<br>
                    Ends At: ${new Date(roundEndsAt.toNumber() * 1000).toLocaleString()}`;
                
                log(`✅ State: Round ${roundNumber}, Pot ${ethers.utils.formatEther(potValue)} ETH`, 'success');
                
            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.textContent = `❌ Failed: ${error.message}`;
                log(`❌ State Read Error: ${error.message}`, 'error');
            }
        };
        
        // Auto-run RPC test on load
        log('🚀 Test page loaded', 'success');
        log('Click buttons above to run tests', 'info');
    </script>
</body>
</html>
