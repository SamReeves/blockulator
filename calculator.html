<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator - Blockulator</title>
    <link rel="icon" type="image/png" href="/blockulator_favicon.png">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="tools-index-page">
    <div id="header-container"></div>
    
    <main class="page-content" style="max-width: 1200px; margin: 0 auto; padding: 1rem;">
        <h1 style="margin: 0 0 1rem 0; font-size: 1.5rem; color: #00ff88;">🧮 On-Chain Scientific Calculator</h1>
        
        <!-- Calculator Display -->
        <div class="calc-display">
            <div class="display-row">
                <label>Input:</label>
                <input type="text" id="calc-input" placeholder="Enter value..." autocomplete="off">
            </div>
            <div class="display-row">
                <label>Result:</label>
                <div id="calc-output">-</div>
                <button id="copy-btn" class="copy-btn" title="Copy result">📋</button>
            </div>
            <div id="status-msg" class="status-msg"></div>
        </div>

        <!-- Calculator Buttons -->
        <div id="calc-buttons" class="calc-buttons">
            <div class="loading">Connecting to blockchain...</div>
        </div>
    </main>
    
    <div id="toast-container"></div>
    
    <!-- External Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    
    <script type="module">
        import { initializePage } from '/shared/js/page-initializer.js';
        import { CALCULATOR_REGISTRY, CATEGORIES } from '/js/domain/calculators/calculator-registry.js';
        import { ContractLoader } from '/js/infrastructure/blockchain/contract-loader.js';
        
        let contracts = {};
        let web3Provider;
        
        async function init() {
            try {
                const result = await initializePage();
                web3Provider = result.web3Provider;
                
                await loadContracts();
                buildButtons();
                setupListeners();
                
                console.log('✅ Calculator ready');
            } catch (error) {
                console.error('❌ Init failed:', error);
                showStatus('Failed to connect to blockchain', 'error');
            }
        }
        
        async function loadContracts() {
            for (const calc of CALCULATOR_REGISTRY) {
                const contract = await ContractLoader.load(calc.id, web3Provider);
                if (contract) {
                    contracts[calc.id] = contract;
                }
            }
        }
        
        function buildButtons() {
            const container = document.getElementById('calc-buttons');
            const grouped = {};
            
            CALCULATOR_REGISTRY.forEach(calc => {
                if (!grouped[calc.category]) grouped[calc.category] = [];
                grouped[calc.category].push(calc);
            });
            
            const sorted = Object.keys(grouped).sort((a, b) => 
                (CATEGORIES[a]?.order || 999) - (CATEGORIES[b]?.order || 999)
            );
            
            let html = '';
            sorted.forEach(catKey => {
                const cat = CATEGORIES[catKey];
                const calcs = grouped[catKey];
                
                html += `
                    <div class="btn-group">
                        <div class="group-label">${cat.icon} ${cat.name}</div>
                        ${calcs.map(c => `
                            <button 
                                class="calc-fn-btn" 
                                data-id="${c.id}"
                                title="${c.description}">
                                ${c.emoji} <span>${c.name}</span>
                            </button>
                        `).join('')}
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function setupListeners() {
            // Function buttons
            document.querySelectorAll('.calc-fn-btn').forEach(btn => {
                btn.addEventListener('click', () => calculate(btn.dataset.id));
            });
            
            // Enter key
            document.getElementById('calc-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const firstBtn = document.querySelector('.calc-fn-btn');
                    if (firstBtn) calculate(firstBtn.dataset.id);
                }
            });
            
            // Copy button
            document.getElementById('copy-btn').addEventListener('click', () => {
                const output = document.getElementById('calc-output').textContent;
                if (output !== '-') {
                    navigator.clipboard.writeText(output);
                    showStatus('Copied!', 'success');
                }
            });
        }
        
        async function calculate(calcId) {
            const input = document.getElementById('calc-input').value.trim();
            const output = document.getElementById('calc-output');
            
            if (!input) {
                showStatus('Enter a value first', 'error');
                return;
            }
            
            const contract = contracts[calcId];
            if (!contract) {
                showStatus(`Contract not available for ${calcId}`, 'error');
                return;
            }
            
            try {
                showStatus('Calculating on-chain...', 'loading');
                
                const value = parseFloat(input);
                let result;
                
                // Handle different input types
                if (calcId === 'factorial' || calcId === 'ln-factorial') {
                    // Integer input
                    result = await contract.calculate(Math.floor(value));
                    if (calcId === 'factorial') {
                        output.textContent = result.toString();
                    } else {
                        output.textContent = (Number(result) / 1e10).toFixed(10);
                    }
                } else if (calcId === 'norm-cdf') {
                    // Uses standard_cdf
                    const scaled = Math.floor(value * 1e10);
                    result = await contract.standard_cdf(scaled);
                    output.textContent = (Number(result) / 1e10).toFixed(10);
                } else {
                    // Standard decimal calculation
                    const scaled = Math.floor(value * 1e10);
                    result = await contract.calculate(scaled);
                    output.textContent = (Number(result) / 1e10).toFixed(10);
                }
                
                showStatus(`✓ ${calcId}(${value}) calculated`, 'success');
            } catch (error) {
                console.error('Calculation error:', error);
                output.textContent = 'Error';
                showStatus(error.message || 'Calculation failed', 'error');
            }
        }
        
        function showStatus(msg, type) {
            const status = document.getElementById('status-msg');
            status.textContent = msg;
            status.className = `status-msg ${type}`;
            
            if (type === 'success') {
                setTimeout(() => status.textContent = '', 2000);
            }
        }
        
        init();
    </script>
    
    <style>
        .calc-display {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        
        .display-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            position: relative;
        }
        
        .display-row:last-of-type {
            margin-bottom: 0;
        }
        
        .display-row label {
            min-width: 60px;
            color: #888;
            font-weight: 500;
            font-size: 0.875rem;
        }
        
        #calc-input {
            flex: 1;
            padding: 0.75rem;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 0.375rem;
            color: #fff;
            font-size: 1.25rem;
            font-family: 'Courier New', monospace;
        }
        
        #calc-input:focus {
            outline: none;
            border-color: #00ff88;
        }
        
        #calc-output {
            flex: 1;
            padding: 0.75rem;
            background: #0a0a0a;
            border: 1px solid #00ff88;
            border-radius: 0.375rem;
            color: #00ff88;
            font-size: 1.25rem;
            font-family: 'Courier New', monospace;
            font-weight: 600;
        }
        
        .copy-btn {
            padding: 0.5rem;
            background: #222;
            border: 1px solid #333;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }
        
        .copy-btn:hover {
            background: #333;
            border-color: #00ff88;
        }
        
        .status-msg {
            font-size: 0.875rem;
            padding: 0.5rem;
            margin-top: 0.5rem;
            border-radius: 0.25rem;
            text-align: center;
        }
        
        .status-msg.loading { color: #888; }
        .status-msg.success { color: #00ff88; }
        .status-msg.error { color: #ff4444; }
        
        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }
        
        .btn-group {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 0.5rem;
            padding: 0.75rem;
        }
        
        .group-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #222;
        }
        
        .calc-fn-btn {
            width: 100%;
            padding: 0.5rem 0.75rem;
            background: #151515;
            border: 1px solid #222;
            border-radius: 0.375rem;
            color: #fff;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 0.875rem;
            text-align: left;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .calc-fn-btn:last-child {
            margin-bottom: 0;
        }
        
        .calc-fn-btn:hover {
            background: #00ff88;
            color: #000;
            border-color: #00ff88;
            transform: translateX(2px);
        }
        
        .loading {
            text-align: center;
            padding: 2rem;
            color: #666;
            grid-column: 1 / -1;
        }
        
        @media (max-width: 768px) {
            .calc-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</body>
</html>
