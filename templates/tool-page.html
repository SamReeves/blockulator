<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{TOOL_DESCRIPTION}} - WhaleGames">
    <title>{{TOOL_TITLE}} - WhaleGames</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐋</text></svg>">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="tool-page">
    <!-- Shared header loaded dynamically -->
    <div id="header-container"></div>
    
    <main class="page-content">
        <!-- Breadcrumb navigation -->
        <nav class="breadcrumb">
            <a href="/index.html" class="breadcrumb-link">Home</a> →
            <a href="/calculator/index.html" class="breadcrumb-link">Tools</a> →
            <span class="breadcrumb-current">{{TOOL_TITLE}}</span>
        </nav>
        
        <!-- Tool container -->
        <div id="tool-container" class="tool-container"></div>
    </main>
    
    <!-- Toast container -->
    <div id="toast-container"></div>
    
    <!-- Initialize page -->
    <script type="module">
        import { initializePage } from '/shared/js/page-initializer.js';
        import { {{TOOL_EXPORT}} } from '/js/domain/calculators/{{TOOL_MODULE}}.js';
        
        async function init() {
            try {
                // Initialize common page components
                const { web3Provider } = await initializePage();
                
                // Initialize tool
                const container = document.getElementById('tool-container');
                const tool = new {{TOOL_EXPORT}}(container, web3Provider);
                await tool.init();
                
                console.log('✅ {{TOOL_TITLE}} page ready');
            } catch (error) {
                console.error('❌ Failed to initialize page:', error);
            }
        }
        
        // Start initialization
        init();
    </script>
</body>
</html>
