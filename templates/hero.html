<section class="hero{% if hero_slim %} slim{% endif %}">
  <canvas class="cloth" data-quiet aria-hidden="true"></canvas>
  <div class="hero-inner wrap">
    <h1>{{ hero_title }}</h1>
    {% if hero_sub %}<p class="sub">{{ hero_sub }}</p>{% endif %}
    {% if hero_actions %}
    <p class="actions">
      <a class="btn primary" href="{{ x.cta_primary_href }}">{{ x.cta_primary_text }}</a>
      <a class="btn ghost" href="{{ x.cta_secondary_href }}">{{ x.cta_secondary_text }}</a>
    </p>
    {% endif %}
  </div>
  <svg class="curve" viewBox="0 0 1440 90" preserveAspectRatio="none" aria-hidden="true"><path d="M0,60 C360,100 1080,0 1440,50 L1440,90 L0,90 Z" fill="currentColor"/></svg>
</section>
