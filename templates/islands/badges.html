                <div class="badge-interface" style="padding-top: 1.5rem;">
                    <div class="badge-sections" style="max-width: 1200px; margin: 0 auto;">

                                </div>
                                <div id="editor-container"></div>

                            </div>

                                    <div style="background: var(--sdr-bg-dark); padding: 1.5rem; border-radius: 12px;">

                                        <div id="current-badge-display" style="text-align: center; margin: 1rem 0;"></div>
                                        <div id="badge-metadata" style="font-size: 0.875rem; color: var(--sdr-text-light);">

                                            <div style="margin: 0.5rem 0;"><strong>Edit Count:</strong> <span id="badge-edit-count"></span></div>
                                            <div style="margin: 0.5rem 0;"><strong>Contract:</strong> <a id="badge-address-link" target="_blank" style="font-family: monospace; font-size: 0.75rem;"></a></div>

                                    </div>
                                    <!-- Editor -->
                                    <div>
                                        <h3 style="margin-top: 0;">Edit Your Badge</h3>
                                        <p style="color: var(--sdr-text-light); margin-bottom: 1rem;">Make changes below, then click "Update Badge" to save on-chain.</p>
                                        <div class="badge-mode-selector">
                                            <button id="edit-mode-editor" class="badge-mode-btn active">✏️ Pixel Editor</button>
                                            <button id="edit-mode-upload" class="badge-mode-btn">🖼️ Upload Image</button>
                                        </div>
                                        <div id="editor-container-edit"></div>
                                        <div id="upload-container-edit" class="hidden"></div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>

                    <!-- Contract Info -->
                    <div id="badge-contract-info" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 1.5rem; margin: 2rem auto; max-width: 1200px;"></div>
                </div>
