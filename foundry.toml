[profile.default]
src = "contracts/src/bench"
out = "out"
libs = ["lib"]
test = "test"
cache_path = "cache"

# Solidity compiler settings
solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = true

# Test settings
verbosity = 3
gas_reports = ["*"]

fs_permissions = [{ access = "read", path = "contracts/build" }]

[profile.default.fuzz]
runs = 256
