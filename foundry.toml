[profile.default]
src = "tests/foundry"
out = "contracts/build/foundry"
libs = ["node_modules", "lib"]
test = "tests/foundry"
cache_path = "contracts/build/cache"
fs_permissions = [{ access = "read", path = "./contracts/build/huff/" }]

# Compiler settings
solc = "0.8.20"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = false

# Huff settings
# Huff files are compiled separately using huffc

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
