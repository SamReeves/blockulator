[profile.default]
src = "contracts/src/bench"
out = "out"
libs = ["lib"]
test = "test"
cache_path = "cache"

# Solidity compiler settings
solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = true

# Test settings
verbosity = 3
gas_reports = ["*"]
ffi = true
gas_limit = "18446744073709551615"

fs_permissions = [
  { access = "read", path = "contracts/build" },
  { access = "read", path = "scripts" }
]

[profile.default.fuzz]
runs = 256
